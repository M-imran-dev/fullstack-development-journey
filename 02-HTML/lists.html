<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>

<body>
    <ul>
        <li>Mango</li>
        <li>Banana</li>
        <li>Apple</li>
        <li>Grapes</li>
        <li>Orange</li>
    </ul>
    <ol type="A">
        <li>
            <h2>Top 6 students</h2>
        </li>
        <li><b>Muhammad Imran</b></li>
        <li>Fahad Khan</li>
        <li>Waheed Khan</li>
        <li>Muhammad Rizwan</li>
        <li>Raziq Ullah</li>
        <li>Muhammad Haseeb</li>
    </ol>
</body>

</html>
