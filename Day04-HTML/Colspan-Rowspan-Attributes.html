<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan Rowspan Attributes</title>
</head>
<body>
    <table border="black">
        <caption>Food Manu</caption>
        <!-- Table Header -->
         <theader>
        <tr>
        <th rowspan="2">Item</th>
        <th colspan="2">Price</th>
        </tr>
        <tr>
            <th>PKR</th>
            <th>USD</th>
        </tr>
        </theader>
        <!-- Table Body -->
        <tbody>
        <tr>
            <td>Chicken</td>
            <td>700</td>
            <td>2.5</td>
        </tr>
        <tr>
            <td>Mutton</td>
            <td>1500</td>
            <td>5.5</td>
        </tr>
        <tr>
            <td>Beef</td>
            <td>1200</td>
            <td>4.3</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
