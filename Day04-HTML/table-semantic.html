<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabl Semanic</title>
</head>
<body>
    <table border="Black">
        <caption>Food Manu</caption>
        <!-- table Header -->
        <theader>
        <tr>
            <th>Item</th>
            <th>Price one kg</th>
            <th>Price half kg</th>
        </tr>
        </theader>
        <!-- Table Body -->
        <tbody>
        <tr>
            <td>Mango</td>
            <td>220</td>
            <td>110</td>
        </tr>
        <tr>
            <td>Apple</td>
            <td>440</td>
            <td>220</td>
        </tr>
        <tr>
            <td>Orange</td>
            <td>320</td>
            <td>150</td>
        </tr>
        <tr>
            <td>Grapes</td>
            <td>550</td>
            <td>250</td>
        </tr>
        <tr>
            <td>Pomegranut</td>
            <td>670</td>
            <td>390</td>
        </tr>
        </tbody>
        <!-- Table Footer -->
        <tfooter>
            <tr>
                <td><b>Total Item</b></td>
                <td><b>Total Price</b></td>
                <td><b>Total price</b></td>
            </tr>
            <tr>
                <td>5</td>
                <td>2200</td>
                <td>1090</td>
            </tr>
        </tfooter>
    </table>
</body>
</html>
