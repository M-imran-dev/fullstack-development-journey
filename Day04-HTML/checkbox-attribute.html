<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox attribute in input</title>
</head>
<body>
    <form action="/server">
        <!-- without checked attribut -->
        <input type="checkbox" name="age" id="age">
        <label for="age">I am 18+</label>
        <button>submit</button>
        <hr>
        <!-- with checked attribute -->
        <input type="checkbox" name="age" id="age1" checked>
        <label for="age1">I am 18+</label>
        <button>submit</button>
        
    </form>
</body>
</html>
