<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in html</title>
</head>

<body>
    <!-- Using Css inside html is not a good practice -->
    <table border="Black">
        <caption>Food Manu</caption>
        <tr>
            <th>Item</th>
            <th>Price one kg</th>
            <th>Price half kg</th>
        </tr>
        <tr>
            <td>Mango</td>
            <td>220</td>
            <td>110</td>
        </tr>
        <tr>
            <td>Apple</td>
            <td>440</td>
            <td>220</td>
        </tr>
        <tr>
            <td>Orange</td>
            <td>320</td>
            <td>150</td>
        </tr>
        <tr>
            <td>Grapes</td>
            <td>550</td>
            <td>250</td>
        </tr>
        <tr>
            <td>Pomegranut</td>
            <td>670</td>
            <td>390</td>
        </tr>
    </table>
</body>

</html>
