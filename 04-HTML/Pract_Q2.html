<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Level 3</title>
</head>
<body>
    <form action="/action">
        <div>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name">
        </div>
        <br>
        <div>
            <label for="sex">Sex:</label>
            <input type="radio" name="sex" id="sex" value="Male">
            <label for="sex">Male</label>
            
            <input type="radio" name="sex" id="sex1" value="Female">
            <label for="sex1">Female</label>
        </div>
        <br>
        <div>
            <label for="Country">Country:</label>
            <select name="country">
                <option>Select an option</option>
                <option value="Pakistan">Pakistan</option>
                <option value="USA">USA</option>
                <option value="India">India</option>
                <option value="UK">UK</option>
                <option value="China">China</option>
            </select>
        </div>
        <br>
        <div>
            <label for="Message">Message:</label>
            <br>
            <textarea cols="20" rows="5"></textarea>
        </div>
        <br>
        <div>
            <input type="checkbox" name="cbox" id="cbox">
            <label for="cbox">Subscribe?</label>
        </div>
        <br>
        <button>Submit</button>
    </form>
</body>
</html>
