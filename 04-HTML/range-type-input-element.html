<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range type</title>
</head>
<body>
    <form action="/server">
        <div>
            <input 
            type="range"
            min="0"
            max="100"
            name="vol"
            id="volume"
            step="10"
            />
            <label for="volume">Select volume level</label>
        </div>
        <button>submit</button>
    </form>
</body>
</html>
