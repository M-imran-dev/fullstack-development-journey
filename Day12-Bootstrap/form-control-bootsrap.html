<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <title>Form Control</title>
</head>
<body>
    <div class="container">
        <form>
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Email">
                </div>
                 <div class="mb-3 col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Password">
                </div>
            </div>
                
            <div class="mb-3">
                <label for="textarea" class="form-label">Text Area</label>
                <textarea id="textarea" class="form-control" placeholder="Enter additional information here" rows="4"></textarea>
            </div>
            <div class="mb-3 row">
                <label for="email2" class="col-sm-1 col-form-label">Email</label>
                <div class="col-sm-10">
                    <input type="email" class="form-control" id="email2">
                </div>
            </div>
            <!-- Select in Bootsrap -->
            <div class="mb-3">
                <select class="form-select form-select-sm">
                    <option selected>Choose Your Country</option>
                    <option value="pk">Pakistan</option>
                    <option value="In">India</option>
                    <option value="USA">USA</option>
                </select>
            </div>
            <!-- Checkbox-->
             <!-- Normal -->
             <div class="normal mb-3">
                <input type="checkbox" class="normal" id="agree">
                <label for="agree" class="normal">I agree</label>
            </div>
            <!-- With Bootsrap -->
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="agree">
                <label for="agree" class="form-check-label">I agree</label>
            </div>
            <!-- Radio Button  -->
            <div class="form-check">
                <input type="radio" class="form-check-input" id="yes" name="radiodefault">
                <label for="yes" class="form-check-label">Yes</label>
            </div>
            <div class="form-check">
               <input type="radio" class="form-check-input" id="no" name="radiodefault">
                <label for="no" class="form-check-label">No</label>
            </div>
            <!-- Switches -->
             <div class="form-check form-switch">
                <input type="radio" class="form-check-input" id="on" name="radiodefault">
                <label for="on" class="form-check-label">ON</label>
            </div>
            <div class="form-check form-switch">
               <input type="radio" class="form-check-input" id="off" name="radiodefault">
                <label for="off" class="form-check-label">OFF</label>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
