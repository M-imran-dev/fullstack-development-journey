<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <title>Form Control</title>
</head>
<body>
    <div class="container">
        <form>
            <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="email">
            </div>
            <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="password">
            </div>
            <div class="mb-3">
                <label for="textarea" class="form-label">Text Area</label>
                <textarea id="textarea" class="form-control" placeholder="enter additional information here" rows="4"></textarea>
            </div>
            <div class="mb-3 row">
                <label for="email2" class="col-sm-1 col-form-label">email</label>
                <div class="col-sm-12">
                    <input type="email" class="form-control" id="email2">
                </div>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
